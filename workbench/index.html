ont-size:19px;margin:0}.muted{font-size:12px;color:#8b9387}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fffdf9;border:1px solid #e4e6dc;border-radius:18px;padding:23px;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px #35412c0b}.ctop{display:flex;align-items:center;justify-content:space-between}.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:#e5ebdf;font-size:22px}.star{background:transparent;font-size:22px;color:#9eac92}.star.on{color:#b69c5e}.card h3{font-size:17px;margin:20px 0 7px}.desc{font-size:13px;min-height:38px;margin:0 0 16px;color:#87907f}.tag{font-size:11px;padding:5px 9px;background:#edf0e8;border-radius:7px;color:#748166}.url{font-size:11px;color:#a0a697;margin:17px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;justify-content:space-between;border-top:1px solid #eeeee6;padding-top:14px;align-items:center}.open,.edit{background:transparent;color:#647b61;font-size:12px}.edit{color:#949c8e}.empty{padding:50px;text-align:center;border:1px dashed #ced5c6;border-radius:16px;color:#839077;grid-column:1/-1}footer{margin:35px 0 0;font-size:12px;color:#949d8d;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}dialog{border:0;border-radius:20px;padding:30px;max-width:480px;width:92%;background:#fafbf6;color:#354232}dialog::backdrop{background:#2d382b66}dialog h2{margin-top:0}label{display:block;font-size:12px;margin:16px 0 7px;color:#79846f}dialog input,dialog select,dialog textarea{width:100%}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#3f523c;color:white;padding:12px 22px;border-radius:12px;display:none;z-index:10}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}aside{width:190px}main{margin-left:190px;padding:30px}}@media(max-width:700px){aside{position:static;width:100%;height:a </style><aside><div class="brand">Leona<span> / </span>Hub</div><div class="sub">我的数字工作空间</div><div id="nav"></div><div class="bottom">少一点寻找，多一点创造。<br>每一个入口，都有自己的位置。<br><br>◌ 个人工作台 · 私密空间</div></aside><main><div class="top"><div><div class="eyebrow">YOUR WORKSPACE, TOGETHER</div><h1>所有工作台，一处抵达。</h1><p>把散落的网址，整理成你的日常工作地图。</p></div><button class="primary" id="add">＋ 添加工作台</button></div><div class="hero"><div><h2>给灵感和效率，留一个入口。</h2><p>收藏常用工具，按场景归类。下一次开始工作，从这里出发。</p></div><div class="orbit">✳</div></div><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="搜索工作台、分类或网址…" aria-label="搜索工作台"><select id="sort" aria-label="排序"><option value="default">默认排序</option><option value="visits">使用次数最多</option><option value="recent">最近访问</option><option value="name">名称排序</option></select><button class="soft" id="batch">批量添加</button></div><div class="heading"><h2 id="section">全部工作台</h2><span class="muted" id="count"></span></div><div class="grid" id="cards"></div><footer><span>数据保存在当前浏览器 · 更换设备前请导出备份</span><div><button class="edit" id="export">导出备份 ↓</button><button class="edit" id="import">导入备份 ↑</button></div></footer></main><dialog id="editor"><form id="form"><h2 id="modalTitle">添加工作台</h2><label for="name">名称</label><input id="name" required maxlength="80" placeholder="例如：我的 AI 创作工作台"><label for="link">网址（未上线可留空）</label><input id="link" placeholder="https://…"><label for="category">分类（也可输入新分类）</label><input id="category" list="categories" required><datalist id="categories"></datalist><label for="description">用途备注</label><textarea id="description" rows="3" maxlength="300" placeholder="这个工作台主要用来做什么？"></textarea><div class="buttons"><button type="button" class="edit" id="delete">删除</button><button type="button" class="soft" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog><dialog id="batchDialog"><h2>批量添加网址</h2><p>每行一个：名称 | 网址 | 分类<br>也可以只粘贴网址，稍后再编辑名称。</p><textarea id="batchText" rows="8" placeholder="AI 工作台 | https://exa const $=id=>document.getElementById(id),key='leona-hub-v1',defaults=[['Leona 的工作台','AI 与创作','灵感整理、写作与个人项目管理','✳'],['Yoda 内容运营','内容与运营','推广规划、内容排期与运营复盘','◈'],['求职作品集','学习与求职','作品展示与实习成果整理','▧'],['钢筋建材 ERP','业务与管理','订单、报价与业务管理','▥'],['书影音记录','生活与记录','收藏与记录阅读、观影感悟','▤'],['人类使用说明书','生活与记录','朋友的生日、喜好与相处记录','♡']].map((x,i)=>({id:'seed'+i,name:x[0],category:x[1],description:x[2],icon:x[3],url:'',favorite:false,visits:0,lastVisit:0}));let data=defaults,active='全部工作台',editing=null;try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved))data=validate(saved)}catch{}const publishedCatalog=[{"id":"appgprj_6acbad513e6c81918a0e20ea50444297","name":"Leona 阶段规划工作台","url":"https://leona-stage-planner.chenshitong544.chatgpt.site","category":"目标与日程","description":"导入目标流程，拆解阶段任务，按可用时间安排统一日程。","icon":"◈","favorite":false,"visits":0,"lastVisit":0},{"id":"appgprj_6ac91bca7ae08191a5ae4f9916aec55c","name":"Yoda 小红书运营工作台","url":"https://yoda-xiaohongshu-ops.chenshitong544.chatgpt.site","category":"内容与运营","description":"小红书日常运营工作入口","icon":"◈","favorite":false,"visits":0,"lastVisit":0},{"id":"appgprj_6ac91856e8b881918da9f9eee7ddb3c8","name":"Yoda 小红书内容运营规划","url":"https://yoda-xiaohongshu-content-plan.chenshitong544.chatgpt.site","category":"内容与运营","description":"小红书内容选题与运营规划","icon":"◈","favorite":false,"visits":0,"lastVisit":0},{"id":"appgprj_6abf6de0953881919985ed06c4311d02","name":"合约研究台","url":"https://zec-futures-workbench.chenshitong544.chatgpt.site","category":"行情与研究","description":"OKX 永续行情、仓位风险与本地交易日志","icon":"◈","favorite":false,"visits":0,"lastVisit":0},{"id":"appgprj_6aa8aeb6fa44819193acf7f398904e06","name":"钢好下单｜建材订单与报价","url":"https://steel-order-desk.chenshitong544.chatgpt.site","category":"业务与管理","description":"客户自助下单、报价确认与定金核实","icon":"◈","favorite":false,"visits":0,"lastVisit":0},{"id":"appgprj_6aa5a0bee51c8191a5ccbeffa4480f38","name":"一隅收藏馆","url":"https://yiyu-story-journal.chenshitong544.chatgpt.site","category":"生活与记录","description":"属于自己的书影音、韩漫与小说感 function mergePublishedCatalog(){
 const marker='leona-hub-catalog-20261012';
 try{if(localStorage.getItem(marker))return}catch{}
 const aliases={'Leona 的工作台':'Leona 的工作台','Yoda 小红书运营工作台':'Yoda 内容运营','陈诗彤｜新媒体 × AI 内容作品集':'求职作品集','一隅收藏馆':'书影音记录'};
 const canonical=u=>u.replace(/\/$/,'');
 for(const entry of publishedCatalog){
  if(data.some(v=>v.url&&canonical(v.url)===canonical(entry.url)))continue;
  const existing=data.find(v=>!v.url&&(v.name===entry.name||v.name===aliases[entry.name]));
  if(existing){existing.url=entry.url;existing.name=entry.name;existing.description=entry.description;existing.category=entry.category}
  else data.push({...entry});
 }
 try{localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(marker,'1')}catch{}
}
mergePublishedCatalog();
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function url(s){if(!s.trim())return '';const u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);if(!['https:','http:'].includes(u.protocol)||!u.hostname.includes('.'))throw Error('请输入有效的 http / https 网址');return u.href}function validate(arr){if(arr.length>2000)throw Error('最多导入 2000 条');return arr.map((v,i)=>{if(!v||typeof v.name!=='string'||!v.name.trim())throw Error('备份格式不正确');return {id:crypto.randomUUID(),name:v.name.slice(0,80),url:url(String(v.url||'')),category:String(v.category||'未分类').slice(0,80),description:String(v.description||'').slice(0,300),icon:String(v.icon||'◈').slice(0,4),favorite:!!v.favorite,visits:Math.max(0,Number(v.visits)||0),lastVisit:Math.max(0,Number(v.lastVisit)||0)}})}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2800)}function save(){try{localStorage.setItem(key,JSON.stringify(data));render();return true}catch{toast('浏览器无法保存，请立即导出备份');render();return false}}function render(){const cats=[...new Set(data.map(v=>v.category))];$('nav').innerHTML=['全部工作台','常用收藏',...cats].map((c,i)=>`<button class="nav ${c===active?'active':''}" data-cat="${escape(c)}">${i===0?'▦':i===1?'☆':'◌'} &nbsp;${escape(c)}</button>`).join('');$('categories').innerHTML=cats.map(c=>`<option value="${escape(c)}">`).join('');$('stats').innerHTML=[[data.length,'工作台总数'],[cats.length,'场景分类'],[data.filter(v=>v.favorite).length,'常用收藏'],[data.reduce((n,v)=>n+v.visits,0),'累计打开次数']].map(v=>`<div class="stat"><b>${v[0].toString().padStart(2,'0')}</b><span>${v[1]}</span></div>`).join('');let list=data.filter(v=>(active==='全部工作台'||active==='常用收藏'&&v.favorite||v.category===active)&&[v.name,v.description,v.category,v.url].join(' ').toLowerCase().includes($('search').value.toLowerCase()));const s=$('sort').value;if(s==='visits')list.sort((a,b)=>b.visits-a.visits);if(s==='recent')list.sort((a,b)=>b.lastVisit-a.lastVisit);if(s==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh'));$('section').textContent=active;$('count').textContent=list.length+' 个入口';$('cards').innerHTML=list.length?list.map(v=>`<article class="card"><div class="ctop"><div class="icon">${escape(v.icon)}</div><button class="star ${v.favorite?'on':''}" data-action="star" data-id="${escape(v.id)}" aria-label="${v.favorite?'取消收藏':'收藏'}">${v.favorite?'★':'☆'}</button></div><h3>${escape(v.name)}</h3><p class="desc">${escape(v.description||'添加一句用途备注，让入口更清晰。')}</p><span class="tag">${escape(v.category)}</span><div class="url">${escape(v.url||'待补充网址 · 点击编辑添加')}</div><div class="actions"><button class="open" data-action="open" data-id="${escape(v.id)}">${v.url?'打开工作台 ↗':'补充网址 ＋'}</button><span class="muted">${v.visits} 次</span><button class="edit" data-action="edit" data-id="${escape(v.id)}">编辑</button></div></article>`).join(''):'<div class="empty">这里还没有匹配的工作台。<br><br>添加一个入口，或试试其他搜索词。</div>'}function edit(id){editing=id;const v=data.find(v=>v.id===id);$('form').reset();$('modalTitle').textContent=v?'编辑工作台':'添加工作台';$('name').value=v?.name||'';$('link').value=v?.url||'';$('category').value=v?.category||'AI 与创作';$('description').value=v?.description||'';$('delete').hidden=!v;$('editor').showModal()}$('nav').onclick=e=>{const b=e.target.closest('[data-cat]');if(b){active=b.dataset.cat;render()}};$('search').oninput=render;$('sort').onchange=render;$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('editor').close();$('cards').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const v=data.find(v=>v.id===b.dataset.id);if(!v)return;if(b.dataset.action==='star'){v.favorite=!v.favorite;save()}else if(b.dataset.action==='edit'||!v.url)edit(v.id);else{const w=window.open(v.url,'_blank','noopener,noreferrer');v.visits++;v.lastVisit=Date.now();save()}};$('form').onsubmit=e=>{e.preventDefault();try{const values={name:$('name').value.trim(),url:url($('link').value.trim()),category:$('category').value.trim(),description:$('description').value.trim()};if(!values.name||!values.category)throw Error('请填写名称和分类');const duplicate=data.find(v=>v.id!==editing&&values.url&&v.url===values.url);if(duplicate)throw Error('这个网址已经添加：'+duplicate.name);if(editing)Object.assign(data.find(v=>v.id===editing),values);else data.push({...values,id:crypto.randomUUID(),icon:'◈',favorite:false,visits:0,lastVisit:0});save();$('editor').close()}catch(e){toast(e.message)}};$('delete').onclick=()=>{if(confirm('删除这个工作台入口？')){data=data.filter(v=>v.id!==editing);save();$('editor').close()}};$('batch').onclick=()=>$('batchDialog').showModal();$('batchCancel').onclick=()=>$('batchDialog').close();$('batchSave').onclick=()=>{try{const rows=$('batchText').value.trim().split('\n').filter(v=>v.trim());if(!rows.length)throw Error('请先粘贴网址');const incoming=rows.map((r,i)=>{const p=r.split('|').map(s=>s.trim()),u=url(p.length===1?p[0]:p[1]);if(!u)throw Error('第 '+(i+1)+' 行缺少网址');return {id:crypto.randomUUID(),name:p.length===1?new URL(u).hostname:p[0]||new URL(u).hostname,url:u,category:p[2]||'未分类',description:'',icon:'◈',favorite:false,visits:0,lastVisit:0}});let n=0;incoming.forEach(v=>{if(!data.some(x=>x.url===v.url)){data.push(v);n++}});save();$('batchText').value='';$('batchDialog').close();toast('已添加 '+n+' 个入口（自动跳过重复网址）')}catch(e){toast(e.message)}};$('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='Leona-workspace-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const a=JSON.parse(await f.text());if(!Array.isArray(a))throw Error('请选择有效的 JSON 备份');const incoming=validate(a);let n=0;incoming.forEach(v=>{if(!data.some(x=>v.url?x.url===v.url:x.name===v.name&&x.category===v.category)){data.push(v);n++}});save();toast('已合并 '+n+' 条记录')}c

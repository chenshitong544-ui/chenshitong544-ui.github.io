px}.stat strong{display:block;font-size:30px;margin-top:12px}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.listrow{padding:16px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}.listrow:last-child{border:0}.listrow .grow{flex:1}.pill{font-size:11px;border-radius:6px;background:#eee9fc;color:#7d65bd;padding:4px 8px;display:inline-block;margin:5px 5px 5px 0}.green{background:#e8f4ee;color:#5e947a}.orange{background:#fff0e4;color:#b88255}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}.day{min-height:88px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:12px}.day.dim{color:#c3bfcd;background:#fcfcfd}.weekday{text-align:center;color:#9c97aa;padding:8px}.today{color:#775ecc;font-weight:700}.event{display:block;text-align:left;font-size:10px;padding:5px;margin:5px 0;border:0;background:#eee9fc;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.assets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.asset{overflow:hidden;padding:0;cursor:pointer}.thumb{height:135px;background:linear-gradient(135deg,#eee9fc,#f8f4e9);display:flex;align-items:center;justify-content:center;font-size:55px}.thumb img{width:100%;height:100%;object-fit:cover}.asset .info{padding:12px}.board{display:flex;gap:14px;overflow:auto;padding-bottom:15px}.column{min-width:230px;flex:1;background:#f0eef5;border-radius:14px;padding:14px}.column .card{padding:14px;margin-top:12px;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.toolbar select{width:150px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px;text-align:left;border-bottom:1px solid var(--line)}th{color:#9390a0;font-weight:500}.empty{padding:35px;text-align:center;color:#9a94a8}.modalback{position:fixed;inset:0;background:#29223855;z-index:30;display:flex;justify-content:flex-end}.modal{width:620px;max-width:100%;background:#fff;overflow:auto;padding:28px;box-shadow:-10px 0 50px #0001}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:15px 0}.field label{display:block;font-size:12px;color:#888;margin-bottom:7px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.comment{background:#f7f6fa;padding:12px;border-radius:9px;margin:9px 0;white-space:pre-wrap}.notice{background:#f0ecfb;color:#73628f;padding:13px 16px;border-radius:10px;margin-bottom:18px;line-height:1.7}.chartbar{height:8px;border-radius:8px;background:#ece7fa;margin:8px 0}.chartbar i{height:100%;display:block;background:#a696df;border-radius:8px}#toast{position:fixed;bottom:25px;left:50%;background:#302b40;color:white;padding:14px 22px;border-radius:12px;display:none;z-index:100}.tabs{display:flex;gap:7px;margin-bottom:20px}.tabs .active{background:#eae3fa;color:#7259b7}@media(max-width:1000px){aside{width:175px;padding:20px 10px}main{margin-left:175px}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}header{padding:15px}#content{padding:20px}}@media(max-width:650px){aside{position:static;width:auto;padding:10px}.brand{padding:5px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}.aside-bottom{display:none}main{margin:0}header input{display:none}header{height:65px}.assets{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.day{min-height:70px;padding:4px}.event{font-size:9px;padding:3px}.pagehead h1{font-size:23px}}
</style><aside><div class="brand"><b>，。</b>人类未完结事务所<small>IP协作工作台</small></div><nav id="nav"></nav><div class="aside-bottom">三人平等协作空间<br>故事还没完，我们继续。<br><button onclick="settings()">成员与账号设置</button></div></aside><main><header><input id="search" placeholder="搜索故事、资产和任务" oninput="render()"><span id="sync">连接云端…</span><div class="right"><button id="identity" onclick="setIdentity()">协作身份</button><button onclick="addCurrent()" class="primary">＋ 新建内容</button></div></header><div id="content"></div></main><div id="overlay"></div><div id="toast"></div><script>const apiBase='https://fzwutbqnytfioniknvvk.supabase.co/functions/v1/ip-workbench';
async function cloudFetch(path,opts={}){const endpoint=path.startsWith('/api/')?apiBase+path.slice(4):path;return fetch(endpoint,{...opts,headers:{...opts.headers,'X-Collab-Key':sessionStorage.getItem('ip-collab-key')||'','X-Member-Name':encodeURIComponent(sessionStorage.getItem('ip-member-name')||'协作成员')}})}
function setIdentity(){let name=prompt('你的姓名（用于标记最后编辑人）',sessionStorage.getItem('ip-member-name')||'');if(name===null)return;let key=prompt('输入三人共享协作码；留空退出编辑',sessionStorage.getItem('ip-collab-key')||'');if(key===null)return;sessionStorage.setItem('ip-member-name',name.trim()||'协作成员');sessionStorage.setItem('ip-collab-key',key.trim());refresh()}

const labels={overview:'项目总览',outline:'运营大纲',stories:'选题故事',tasks:'制作看板',calendar:'发布日历',assets:'角色与场景',metrics:'账号数据',archive:'毕设归档'};
const icons=['◈','▤','✧','▥','▦','♧','▥','▣'];let view='overview',data=[],me={},month=new Date(),dirty=false,editing=null;const states=['灵感','待制作','制作中','待发布','已发布'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—';const platform=r=>r.platform||'未分配';
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
async function api(path,opts={}){let r=await cloudFetch(path,{...opts,headers:{'Content-Type':'application/json',...opts.headers}});let j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
async function refresh(){try{let r=await api('/api/records');data=r.records;me=r.user;document.querySelector('#identity').textContent=me.name+' · 协作身份';document.querySelector('#sync').textContent='云端已同步';if(!dirty)render()}catch(e){document.querySelector('#sync').textContent='连接失败';toast(e.message)}}
function list(type){let q=document.querySelector('#search').value.toLowerCase();return data.filter(r=>r.type===type&&!r.deleted&&JSON.stringify(r).toLowerCase().includes(q))}
function profile(){return data.find(r=>r.type==='settings'&&!r.deleted)?.fields||{members:'诗彤\n成员二\n成员三',accounts:'小红书\n抖音\nB站',weeks:10}}
function head(title,sub,button=''){return '<div class="pagehead"><div><h1>'+title+'</h1><div class="muted">'+sub+'</div></div>'+button+'</div>'}
function edited(r){return '<div class="muted">最后编辑：'+esc(r.editor)+' · '+fmt(r.updated)+'</div>'}
function row(r){return '<div class="listrow"><div class="grow"><b>'+esc(r.title)+'</b><br><span class="pill">'+esc(r.category||r.platform||r.type)+'</span><span class="pill green">'+esc(r.status||'记录')+'</span>'+edited(r)+'</div><button onclick="openRecord(\''+r.id+'\')">打开</button></div>'}
function render(){document.querySelector('#nav').innerHTML=Object.entries(labels).map(([k,v],i)=>'<button class="'+(view===k?'active':'')+'" onclick="view=\''+k+'\';render()">'+icons[i]+'　'+v+'</button>').join('');let c=document.querySelector('#content');if(view==='overview'){let pub=list('publication'),t=list('task');c.innerHTML=head('下午好，今天继续故事','把灵感变成作品，把作品变成积累。')+'<div class="cards">'+[['待发布',pub.filter(x=>x.status!=='已发布').length],['制作中',t.filter(x=>x.status==='制作中').length],['故事选题',list('story').length],['资产总数',list('asset').length]].map(([a,b])=>'<div class="card stat"><span class="muted">'+a+'</span><strong>'+b+'</strong></div>').join('')+'</div><div class="grid"><div><section class="card">'+cal()+'</section><section class="card" style="margin-top:20px"><div class="panelhead"><h2>选题与故事</h2><button onclick="view=\'stories\';render()">查看全部</button></div>'+list('story').slice(0,3).map(row).join('')+'</section></div><div><section class="card"><div class="panelhead"><h2>本周协作</h2><button onclick="newRecord(\'task\')">＋任务</button></div>'+(t.slice(0,4).map(row).join('')||'<div class="empty">添加第一项任务，开始协作</div>')+'</section><section class="card" style="margin-top:20px"><h2>账号概况</h2><div class="listrow">'+profile().accounts.split('\n').map(x=>'<span class="pill">'+esc(x)+' · '+list('metric').filter(r=>r.platform===x).length+'条数据</span>').join('')+'</div></section><section class="card" style="margin-top:20px"><div class="panelhead"><h2>角色与场景资产</h2><button onclick="view=\'assets\';render()">查看全部</button></div>'+assetCards(list('asset').slice(0,3))+'</section></div></div>'}
else if(view==='calendar'){c.innerHTML=head('发布日历','按账号安排发布，计划与实际时间分别记录。','<button class="primary" onclick="newRecord(\'publication\')">＋发布计划</button>')+'<div class="card">'+cal()+'</div><div class="card" style="margin-top:20px">'+list('publication').map(row).join('')+'</div>'}
else if(view==='tasks'){c.innerHTML=head('制作看板','分工明确，所有成员都能更新进度。','<button class="primary" onclick="newRecord(\'task\')">＋任务</button>')+'<div class="board">'+states.map(s=>'<div class="column"><h3>'+s+' · '+list('task').filter(t=>t.status===s).length+'</h3>'+list('task').filter(t=>t.status===s).map(t=>'<div class="card" onclick="openRecord(\''+t.id+'\')"><b>'+esc(t.title)+'</b><p class="muted">负责人：'+esc(t.owner||'未分配')+'<br>截止：'+esc(t.date||'未设置')+'</p>'+edited(t)+'</div>').join('')+'</div>').join('')+'</div>'}
else if(view==='assets'){c.innerHTML=head('角色与场景','保存标准形象、场景、提示词和制作版本。','<button class="primary" onclick="newRecord(\'asset\')">＋上传资产</button>')+assetCards(list('asset'))}
else if(view==='metrics')metrics(c);
else{let type={stories:'story',outline:'outline',archive:'archive'}[view];c.innerHTML=head(labels[view],view==='outline'?'定位、世界观、栏目规划与阶段目标。':view==='archive'?'调研、会议、导师意见、直播与个人工作记录。':'从灵感开始，逐步完善故事、台词和分镜。','<button class="primary" onclick="newRecord(\''+type+'\')">＋新增</button>')+'<div class="card">'+(list(type).map(row).join('')||'<div class="empty">还没有内容，点击新增开始记录</div>')+'</div>'} }
function cal(){let y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7;let html='<div class="panelhead"><h2>发布日历</h2><div><button onclick="moveMonth(-1)">‹</button>　'+y+'年'+(m+1)+'月　<button onclick="moveMonth(1)">›</button></div></div><div style="display:grid;grid-template-columns:repeat(7,1fr)">'+['一','二','三','四','五','六','日'].map(x=>'<div class="weekday">周'+x+'</div>').join('')+'</div><div class="calendar">';for(let i=0;i<42;i++){let d=new Date(y,m,i-first+1),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');html+='<div class="day '+(d.getMonth()!==m?'dim':'')+'"><span>'+d.getDate()+'</span>'+list('publication').filter(r=>r.date?.slice(0,10)===ds).map(r=>'<button class="event" onclick="openRecord(\''+r.id+'\')">'+esc(r.platform)+' · '+esc(r.title)+'</button>').join('')+'</div>'}return html+'</div>'}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function assetCards(arr){return '<div class="assets">'+arr.map(r=>'<div class="asset card" onclick="openRecord(\''+r.id+'\')"><div class="thumb">'+(r.file&&r.mime?.startsWith('image/')?'<img src="https://fzwutbqnytfioniknvvk.supabase.co/functions/v1/ip-workbench/file/'+r.file+'" alt="'+esc(r.title)+'">':r.category==='场景'?'▧':r.title.includes('逗号')?'，':'。')+'</div><div class="info"><b>'+esc(r.title)+'</b><div class="muted">'+esc(r.category)+' · '+esc(r.version||'v1')+'</div>'+edited(r)+'</div></div>').join('')+'</div>'}
function metrics(c){let rows=list('metric');let acc=profile().accounts.split('\n');c.innerHTML=head('账号数据','同平台、同采集时间窗口比较；空白指标不会当作零。','<button class="primary" onclick="newRecord(\'metric\')">＋录入数据</button>')+'<div class="toolbar"><button onclick="exportData()">导出全部JSON</button><button onclick="importData()">导入CSV / JSON</button><button onclick="downloadTemplate()">下载CSV模板</button></div><div class="cards">'+acc.map(a=>{let rs=rows.filter(r=>r.platform===a);return '<div class="card"><h3>'+esc(a)+'</h3><div class="muted">'+rs.length+'次采集 · 最新采集播放</div><h1>'+((rs.sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]?.fields?.views)??'—')+'</h1></div>'}).join('')+'</div><div class="card" style="overflow:auto"><table><thead><tr><th>内容</th><th>账号</th><th>采集时间</th><th>播放</th><th>点赞</th><th>评论</th><th>收藏</th><th>粉丝</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.title)+'</td><td>'+esc(r.platform)+'</td><td>'+esc(r.date)+'</td>'+['views','likes','comments','saves','followers'].map(k=>'<td>'+esc(r.fields?.[k]??'—')+'</td>').join('')+'<td><button onclick="openRecord(\''+r.id+'\')">编辑</button></td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">尚未录入真实数据</div>')+'</div>'}
function addCurrent(){newRecord({overview:'story',outline:'outline',stories:'story',tasks:'task',calendar:'publication',assets:'asset',metrics:'metric',archive:'archive'}[view])}
function newRecord(type){if(!me.canEdit)return toast('当前为只读访问；请点击右上角协作身份输入协作码');openRecord(null,{type,title:'',status:type==='story'?'灵感':'待制作',fields:{},comments:[]})}
function settings(){if(!me.canEdit)return toast('当前为只读访问');let r=data.find(r=>r.type==='settings'&&!r.deleted);openRecord(r?.id,r||{type:'settings',title:'成员与账号设置',fields:profile(),comments:[]})}
function field(label,key,val='',type='text'){return '<div class="field"><label>'+label+'</label><input name="'+key+'" type="'+type+'" value="'+esc(val)+'"></div>'}
function openRecord(id,fresh){let r=id?data.find(x=>x.id===id):fresh;editing=r;dirty=false;let f=r.fields||{};let spec='';if(r.type==='settings'){spec='<div class="field"><label>成员名称，每行一个（分工标签；编辑身份来自登录账号）</label><textarea name="members">'+esc(f.members)+'</textarea></div><div class="field"><label>账号名称，每行一个</label><textarea name="accounts">'+esc(f.accounts)+'</textarea></div>'+field('目标运营周数','weeks',f.weeks,'number')}
else{spec='<div class="formgrid">'+field('分类 / 栏目','category',r.category)+'<div class="field"><label>状态</label><select name="status">'+states.map(s=>'<option '+(s===r.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="field"><label>负责人</label><select name="owner"><option value="">未分配</option>'+profile().members.split('\n').map(n=>'<option '+(n===r.owner?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div><div class="field"><label>平台 / 账号</label><select name="platform"><option value="">未分配</option>'+profile().accounts.split('\n').map(n=>'<option '+(n===r.platform?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'+field(r.type==='metric'?'数据采集时间':'计划 / 截止时间','date',r.date,'datetime-local')+field('版本','version',r.version||'v1')+'</div><div class="field"><label>关联故事</label><select name="storyId"><option value="">不关联</option>'+list('story').filter(s=>s.id!==r.id).map(s=>'<option value="'+s.id+'" '+(s.id===r.storyId?'selected':'')+'>'+esc(s.title)+'</option>').join('')+'</select></div>'+field('参考链接 / 发布链接','link',r.link,'url')+(r.type==='publication'?field('实际发布时间','actual',r.actual,'datetime-local'):'');if(r.type==='metric'){spec+='<div class="formgrid">'+[['播放','views'],['点赞','likes'],['评论','comments'],['收藏','saves'],['分享','shares'],['粉丝总数','followers'],['平均观看秒数','watch'],['完播率 %','completion']].map(([a,b])=>field(a,b,f[b],'number')).join('')+'</div>'}spec+='<div class="field"><label>'+({story:'故事内容 / 冲突 / 结尾 / 台词 / 分镜',asset:'提示词 / 使用说明 / 来源',task:'任务说明与检查清单',outline:'规划正文',archive:'过程记录与证据',metric:'采集说明与复盘',publication:'发布文案与复盘'}[r.type]||'内容')+'</label><textarea name="body" style="min-height:190px">'+esc(r.body)+'</textarea></div>';if(['asset','archive'].includes(r.type)){spec+='<div class="field"><label>附件（单文件 ≤ 20MB）</label><input type="file" id="upload">'+(r.file?'<p><a target="_blank" href="https://fzwutbqnytfioniknvvk.supabase.co/functions/v1/ip-workbench/file/'+r.file+'">查看 / 下载 '+esc(r.filename)+'</a></p>':'')+'</div>'}}
document.querySelector('#overlay').innerHTML='<div class="modalback"><div class="modal"><div class="panelhead"><h2>'+esc(r.title||'新增内容')+'</h2><button onclick="closeModal()">关闭</button></div>'+edited(r)+'<form id="form"><div class="field"><label>标题</label><input name="title" required value="'+esc(r.title)+'"></div>'+spec+'<div class="actions"><button class="primary" type="submit">保存到云端</button>'+(r.id?'<button type="button" onclick="removeRecord()">移入回收站</button>':'')+'</div></form><h3>讨论与修改记录</h3>'+(r.comments||[]).map(x=>'<div class="comment">'+esc(x.text)+'<div class="muted">'+esc(x.author)+' · '+fmt(x.at)+'</div></div>').join('')+'<textarea id="comment" placeholder="补充意见，保存时一并记录"></textarea><details style="margin-top:20px"><summary>历史版本与回收站</summary><button onclick="historyRecord()">查看历史 / 恢复</button><button onclick="trash()">查看回收站</button></details></div></div>';document.querySelector('#form').oninput=()=>dirty=true;document.querySelector('#form').onsubmit=saveRecord}
function closeModal(){if(dirty&&!confirm('尚未保存，确定关闭？'))return;dirty=false;editing=null;document.querySelector('#overlay').innerHTML='';render()}
async function saveRecord(e){e.preventDefault();if(!me.canEdit)return toast('请输入正确的协作码后编辑');let form=new FormData(e.target),r={...editing};r.fields={...(r.fields||{})};for(let [k,v]of form){if(['members','accounts','weeks','views','likes','comments','saves','shares','followers','watch','completion'].includes(k)){r.fields[k]=v===''?null:(['members','accounts'].includes(k)?v:Number(v))}else r[k]=v}if(r.link&&!/^https?:\/\//i.test(r.link))return toast('链接须以 http:// 或 https:// 开头');let comment=document.querySelector('#comment').value.trim();try{let file=document.querySelector('#upload')?.files[0];if(file){if(file.size>20*1024*1024)throw Error('附件超过20MB');let resp=await cloudFetch('/api/upload',{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','X-Filename':encodeURIComponent(file.name)},body:file});let j=await resp.json();if(!resp.ok)throw Error(j.error);Object.assign(r,j)}let saved=await api('/api/record',{method:'POST',body:JSON.stringify({record:r,comment})});dirty=false;document.querySelector('#overlay').innerHTML='';editing=null;await refresh();toast('已保存，三人共享空间已更新')}catch(err){toast(err.message)}}
async function removeRecord(){if(!confirm('移入回收站？可以恢复。'))return;try{await api('/api/record',{method:'POST',body:JSON.stringify({record:{...editing,deleted:true}})});dirty=false;closeModal();await refresh()}catch(e){toast(e.message)}}
async function historyRecord(){if(!editing?.id)return toast('请先保存');let j=await api('/api/history/'+editing.id);let choices=j.versions.map((x,i)=>i+': '+fmt(x.updated)+' '+x.editor+' '+x.title).join('\n');let n=prompt('输入历史序号恢复（将生成新版本）：\n'+choices);if(n===null)return;let old=j.versions[Number(n)];if(!old)return toast('序号无效');await api('/api/record',{method:'POST',body:JSON.stringify({record:{...old,rev:editing.rev}})});dirty=false;closeModal();await refresh();toast('已恢复历史版本')}
function trash(){let arr=data.filter(x=>x.deleted);let n=prompt('输入序号恢复：\n'+arr.map((r,i)=>i+': '+r.title).join('\n'));if(n===null)return;let r=arr[Number(n)];if(r)api('/api/record',{method:'POST',body:JSON.stringify({record:{...r,deleted:false}})}).then(refresh).then(()=>toast('已恢复'))}
function download(name,text,mime='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(){download('事务所工作台备份.json',JSON.stringify({exported:new Date().toISOString(),records:data},null,2))}
function downloadTemplate(){download('账号数据模板.csv','title,platform,date,views,likes,comments,saves,shares,followers\n示例标题,小红书,2026-10-14T18:00,,,,,,\n','text/csv;charset=utf-8')}
function csvParse(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if(c==='\n'&&!quoted){row.push(v.replace(/\r$/,''));rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);rows.push(row)}let keys=rows.shift().map(x=>x.replace(/^\uFEFF/,''));return rows.filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||''])))}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.csv,.json';input.onchange=async()=>{try{let text=await input.files[0].text(),arr=input.files[0].name.endsWith('.csv')?csvParse(text):JSON.parse(text);arr=Array.isArray(arr)?arr:arr.records;if(!Array.isArray(arr)||arr.length>100)throw Error('一次导入不超过100条');if(!confirm('预览：共'+arr.length+'条\n'+arr.slice(0,5).map(r=>r.title+' / '+(r.platform||r.type)).join('\n')+'\n确认新增导入？（不会覆盖原记录）'))return;for(let x of arr){let fields={...(x.fields||{})};for(let k of ['views','likes','comments','saves','shares','followers'])if(x[k]!==undefined)fields[k]=x[k]===''?null:Number(x[k]);await api('/api/record',{method:'POST',body:JSON.stringify({record:{...x,id:undefined,rev:undefined,type:x.type||'metric',fields}})})}await refresh();toast('导入完成')}catch(e){toast(e.message)}};input.click()}
refresh();setInterval(refresh,20000);
</script></html>

<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泊选 · 跨境选品工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#173438;font:16px/1.55 Inter,"Microsoft Yahei",sans-serif}header,main{max-width:1220px;margin:auto;padding:20px 5%}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #d5e1de}header strong{font-size:23px}.mark{background:#09695f;color:white;border-radius:10px;padding:2px 11px;font-size:25px}small{color:#55706c}header small{margin-left:auto}h1{margin:0;font-size:clamp(26px,4vw,42px)}h2{font-size:22px;margin:0}h3{margin:0}button,a.btn{font:inherit;cursor:pointer;border:1px solid #bfd2cd;color:#1a514a;background:white;border-radius:9px;padding:8px 14px;text-decoration:none}button:hover,a.btn:hover{background:#e5f3ef}button.primary{background:#086b60;color:white;border-color:#086b60}.hero{background:#143f40;color:white;padding:clamp(22px,4vw,42px);border-radius:20px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;right:-80px;top:-160px;border:36px double #437370;border-radius:40%;transform:rotate(35deg);pointer-events:none}.hero p{color:#c3dfd8;margin:5px 0 19px}.hero form,.row,nav,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hero input{max-width:460px;flex:1;min-width:140px}.hero button{background:#cff285}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat,article,dialog{background:white;border:1px solid #dae4e0;border-radius:14px;padding:18px}.stat b{display:block;font:600 30px/1.3 Inter,sans-serif}nav{margin:24px 0 18px}nav button.on{background:#174e49;color:white}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(295px,100%),1fr));gap:14px}article small,article p{display:block;margin:5px 0 14px}.tag{font-size:13px;color:#136c60;background:#e0f2e9;border-radius:6px;padding:3px 7px}.actions{margin-top:12px}.actions button,.actions a{font-size:14px}dialog{width:min(560px,94vw);max-height:85vh;color:inherit}dialog::backdrop{background:#102e3290}dialog form{display:grid;gap:12px}label{display:grid;gap:4px;font-size:14px}input,select,textarea{width:100%;padding:10px 12px;border:1px solid #b8cdc8;border-radius:8px;font:inherit}label.check{display:flex;align-items:center}.check input{width:auto}.offer{border-top:1px solid #dae4df;padding:12px 0}footer{margin:24px 0;font-size:14px;color:#57716b}#msg{color:#a23924}.identity{display:flex;gap:8px;align-items:center}.tools{margin-left:auto;display:flex;gap:6px}@media(max-width:600px){header small{display:none}.stats{gap:6px}.stat{padding:10px}.hero{padding:21px}.heading{flex-wrap:wrap}nav button{padding:7px}.tools button{font-size:13px}}
</style><header><div class="identity"><span class="mark">≋</span><strong>泊选</strong><small>跨境运营工作台</small></div><div class="tools"><button id="backup">导出数据</button><button id="restore">恢复备份</button></div></header><main><section class="hero"><h1>选品工作台</h1><p>从发现货源，到为每家店铺准备上新。</p><form id="search"><input required name="q" aria-label="商品关键词" placeholder="输入商品关键词，如：折叠收纳箱"><button>去 1688 找货 ↗</button></form></section><div class="stats" id="stats"></div><nav id="tabs"></nav><div id="body"></div><footer>当前浏览器保存 · 可导出备份迁移数据</footer></main><dialog id="dlg"><section id="panel"></section></dialog><input hidden type="file" id="file" accept=".json"><script>const $=id=>document.getElementById(id), key='boxuan-v1', empty=()=>({shops:[],products:[],offers:[],drafts:[]});
let db=JSON.parse(localStorage.getItem(key)||'null')||empty(),tab=0,filter='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>crypto.randomUUID(), by=(k,i)=>db[k].find(x=>x.id===i);
const safe=u=>{try{let a=new URL(u);return /^https?:$/.test(a.protocol)?a.href:''}catch{return ''}};
const btn=(t,a)=>'<button type="button" onclick="'+a+'">'+t+'</button>', link=(t,u)=>safe(u)?'<a class="btn" target="_blank" rel="noopener noreferrer" href="'+esc(safe(u))+'">'+t+' ↗</a>':'';
const call=(fn,id)=>fn+"('"+id+"')", action=(t,fn,i)=>btn(t,call(fn,i));
const field=(t,n,v='',type='text',extra='')=>'<label>'+t+'<input required name="'+n+'" type="'+type+'" value="'+esc(v)+'" '+extra+'></label>';
function save(){localStorage.setItem(key,JSON.stringify(db));draw()}
function modal(title,html,submit){$('panel').innerHTML='<form><h2>'+title+'</h2>'+html+'<span id="msg"></span><div class="actions">'+(submit?'<button class="primary">保存</button>':'')+btn('关闭','dlg.close()')+'</div></form>';if(!$('dlg').open)$('dlg').showModal();$('panel').firstChild.onsubmit=e=>{e.preventDefault();try{submit(new FormData(e.target));save();$('dlg').close()}catch(err){$('msg').textContent=err.message}}}
function searchURL(q){return 'https://s.1688.com/selloffer/offer_search.htm?charset=utf8&keywords='+encodeURIComponent(q)}
$('search').onsubmit=e=>{e.preventDefault();let q=new FormData(e.target).get('q').trim();if(q)window.open(searchURL(q),'_blank','noopener')};
function shop(i){let s=by('shops',i)||{};modal(i?'编辑店铺':'添加店铺',field('店铺名称','name',s.name)+field('销售平台','platform',s.platform||'TikTok Shop')+field('站点 / 市场','region',s.region)+field('结算币种','currency',s.currency||'USD','text','pattern="[A-Za-z]{3}"'),f=>{let v=Object.fromEntries(f);v.currency=v.currency.toUpperCase();if(i)Object.assign(s,v);else db.shops.push({...v,id:id()})})}
function product(i){let p=by('products',i)||{};modal(i?'编辑选品':'新增选品',field('商品名称 / 找货关键词','name',p.name)+field('计划采购数量','qty',p.qty||10,'number','min="1"')+field('最长可接受发货天数','days',p.days||7,'number','min="1"')+'<label>选品备注<textarea name="note">'+esc(p.note)+'</textarea></label>',f=>{let v=Object.fromEntries(f);if(i){Object.assign(p,v);if(p.lock&&!eligible(p,by('offers',p.lock)))delete p.lock}else db.products.unshift({...v,id:id()})})}
function eligible(p,o){return o&&+o.moq<=+p.qty&&+o.days<=+p.days}
const cost=(p,o)=>+o.price*+p.qty+(+o.freight);
function offers(i){let p=by('products',i);let list=db.offers.filter(x=>x.pid===i).sort((a,b)=>Number(eligible(p,b))-Number(eligible(p,a))||cost(p,a)-cost(p,b)||a.days-b.days);modal('货源比价 · '+esc(p.name),'<small>按 '+esc(p.qty)+' 件采购。先筛起订量及交期，再按含运费总价排序。</small>'+list.map((o,n)=>'<div class="offer"><b>'+esc(o.name)+'</b> <span class="tag">'+(p.lock===o.id?'已锁定':eligible(p,o)?n===0?'当前候选最优':'符合条件':'不满足采购条件')+'</span><p>¥'+cost(p,o).toFixed(2)+' 总价 · '+esc(o.moq)+' 件起订 · '+esc(o.days)+' 天发货</p><div class="actions">'+link('联系商家 / 查看货源',o.url)+(eligible(p,o)?action('锁定货源','lock',o.id):'')+'</div></div>').join('')+'<div class="actions">'+link('搜索同款',searchURL(p.name))+action('录入报价','offer',i)+'</div>')}
function lock(i){let o=by('offers',i),p=by('products',o.pid);if(eligible(p,o)){p.lock=i;save();offers(p.id)}}
function offer(i){modal('录入供应商报价',field('供应商 / 店铺名','name')+field('商品或商家联系链接','url','','url')+field('人民币单价','price','','number','min=".01" step=".01"')+field('本批总运费（元）','freight',0,'number','min="0" step=".01"')+field('起订量','moq',1,'number','min="1"')+field('发货天数','days',2,'number','min="1"'),f=>{let v=Object.fromEntries(f);if(!safe(v.url))throw Error('请输入有效的商品或商家链接');db.offers.push({...v,id:id(),pid:i})})}
function distribute(i){let p=by('products',i);if(!p.lock)return offers(i);if(!db.shops.length)return shop();modal('分配铺货草稿',field('刊登标题','title',p.name)+db.shops.map(s=>'<label class="check"><input type="checkbox" name="shop" value="'+s.id+'">'+esc(s.name+' · '+s.region)+'</label>').join(''),f=>{let targets=f.getAll('shop');if(!targets.length)throw Error('请至少选择一家店铺');for(let sid of targets){let v={pid:i,sid,title:f.get('title'),oid:p.lock},d=db.drafts.find(x=>x.pid===i&&x.sid===sid);if(d)Object.assign(d,v);else db.drafts.unshift({...v,id:id()})}})}
function csv(i){let d=by('drafts',i),s=by('shops',d.sid),o=by('offers',d.oid);download('铺货草稿.csv','\ufeff'+[['标题','店铺','站点','货源','单价（CNY）'],[d.title,s.name,s.region,o.url,o.price]].map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv')}
function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function draw(){let names=['选品池','站点与店铺','铺货草稿'];$('stats').innerHTML=[['在选商品',db.products.length],['运营店铺',db.shops.length],['铺货草稿',db.drafts.length]].map(([l,v])=>'<div class="stat"><small>'+l+'</small><b>'+v+'</b></div>').join('');$('tabs').innerHTML=names.map((s,i)=>'<button class="'+(i===tab?'on':'')+'" onclick="tab='+i+';draw()">'+s+'</button>').join('');let items=tab===0?db.products:tab===1?db.shops:db.drafts;
let cards=items.filter(x=>tab===0||!filter||(tab===1?x.region:by('shops',x.sid).region)===filter).map(x=>{if(tab===0)return '<article><span class="tag">'+(x.lock?'货源已锁定':'待比价')+'</span><h3>'+esc(x.name)+'</h3><small>计划 '+esc(x.qty)+' 件 · '+esc(x.days)+' 天内发货</small><p>'+esc(x.note)+'</p><div class="actions">'+link('1688 找同款',searchURL(x.name))+action('比价','offers',x.id)+action('编辑','product',x.id)+(x.lock?action('分配到店铺','distribute',x.id):'')+'</div></article>';if(tab===1)return '<article><span class="tag">'+esc(x.region)+'</span><h3>'+esc(x.name)+'</h3><small>'+esc(x.platform+' · '+x.currency)+' · 手动管理</small>'+action('编辑店铺','shop',x.id)+'</article>';let s=by('shops',x.sid),o=by('offers',x.oid);return '<article><span class="tag">待刊登</span><h3>'+esc(x.title)+'</h3><small>'+esc(s.name+' · '+s.region)+'</small><p>供应商：'+esc(o.name)+'</p><div class="actions">'+link('查看货源',o.url)+action('导出草稿','csv',x.id)+'</div></article>'}).join('');
$('body').innerHTML='<div class="heading"><h2>'+names[tab]+'</h2><div class="row">'+(tab?'<select aria-label="筛选站点" style="width:auto" onchange="filter=this.value;draw()"><option value="">全部站点</option>'+[...new Set(db.shops.map(s=>s.region))].map(r=>'<option '+(r===filter?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select>':'')+(tab<2?'<button class="primary" onclick="'+(tab?'shop()':'product()')+'">'+(tab?'＋ 添加店铺':'＋ 新增选品')+'</button>':'')+'</div></div><div class="grid">'+(cards||'<article><h3>'+['添加第一个选品','添加第一家店铺','暂无铺货草稿'][tab]+'</h3><p>'+['记下商品名称和采购数量，即可去 1688 找同款、比较报价。','填写店铺名称和销售市场，即可按站点管理。','在选品池锁定货源后，点击「分配到店铺」。'][tab]+'</p></article>')+'</div>'}
$('backup').onclick=()=>download('泊选备份.json',JSON.stringify(db,null,2),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());for(let k of Object.keys(empty()))if(!Array.isArray(v[k])||v[k].some(x=>!x||!/^[a-f0-9-]{36}$/.test(x.id)))throw Error();let has=(k,i)=>v[k].some(x=>x.id===i);if(v.products.some(p=>p.lock&&!has('offers',p.lock))||v.offers.some(o=>!has('products',o.pid))||v.drafts.some(d=>!has('shops',d.sid)||!has('offers',d.oid)||!has('products',d.pid)))throw Error();if(confirm('以备份内容替换本浏览器的数据？')){db=v;filter='';save()}}catch{alert('无法读取此备份')}e.target.value=''};draw();
</script></html>
